version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codeforge_postgres
    restart: always
    environment:
      POSTGRES_USER: codeforge
      POSTGRES_PASSWORD: codeforge123
      POSTGRES_DB: codeforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
